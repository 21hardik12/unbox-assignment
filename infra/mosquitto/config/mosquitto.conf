# =============================================================================
# Eclipse Mosquitto broker configuration for the speedometer pipeline.
# =============================================================================

# --- MQTT listener (used by the simulator and backend) ---
listener 1883
protocol mqtt

# --- WebSocket listener (lets a browser speak MQTT directly if ever needed) ---
listener 9001
protocol websockets

# --- Authentication ---
# Anonymous access is enabled to keep the demo single-command runnable.
# For production: set "allow_anonymous false" and provision a password file
#   docker compose exec mqtt mosquitto_passwd -c /mosquitto/config/passwd <user>
# then add: password_file /mosquitto/config/passwd
allow_anonymous true

# --- Persistence ---
# Survive broker restarts (queued QoS 1/2 messages, retained messages).
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
# Log to stdout so "docker compose logs mqtt" shows broker activity.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
